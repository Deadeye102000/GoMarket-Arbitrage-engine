apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gomarket.fullname" . }}
  labels:
    {{- include "gomarket.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gomarket.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gomarket.selectorLabels" . | nindent 8 }}
    spec:
      # Graceful shutdown: give the engine time to drain its pipeline
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Non-secret config from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "gomarket.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secretName }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Handle SIGTERM for graceful shutdown (matches our signal.NotifyContext)
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
